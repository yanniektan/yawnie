<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Yawnie Daily</title>
  <link rel="stylesheet" href="paper.css">
</head>
<body>
  <header class="masthead">
    <h1>THE YAWNIE DAILY</h1>
    <p>{{dateline}}</p>
  </header>
  <section class="counters">{{counters}}</section>
  <div class="row">
    <section>{{weather-outfit}}</section>
    <section>{{profg-insights}}</section>
  </div>
  <section class="stock">{{stock-groceries}}{{stock-yoga}}{{stock-budget}}</section>
  <div class="row">
    <section>{{social-hours}}</section>
    <section>{{sad-songs}}</section>
  </div>
  <section>{{deep-dive}}</section>
  <section>{{chem-fact}}</section>
  <section class="comic">{{comic}}</section>
  <!-- Screen only, never printed -->
  <nav class="actions no-print">{{actions}}</nav>
</body>
</html>
